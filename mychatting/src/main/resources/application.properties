spring.application.name=mychatting
# WEB 服务配置
server.port=9000

# ==================== DeepSeek 聊天模型 ====================
# api-key 通过环境变量 DEEPSEEK_API_KEY 注入，切勿将真实密钥提交到代码仓库
langchain4j.open-ai.chat-model.api-key=${DEEPSEEK_API_KEY}
langchain4j.open-ai.chat-model.model-name=deepseek-chat
langchain4j.open-ai.chat-model.base-url=https://api.deepseek.com/v1
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true

langchain4j.open-ai.streaming-chat-model.api-key=${DEEPSEEK_API_KEY}
langchain4j.open-ai.streaming-chat-model.model-name=deepseek-chat
langchain4j.open-ai.streaming-chat-model.base-url=https://api.deepseek.com/v1
langchain4j.open-ai.streaming-chat-model.log-requests=true
langchain4j.open-ai.streaming-chat-model.log-responses=true

# ==================== 阿里云百炼 DashScope（RAG 向量嵌入） ====================
# api-key 通过环境变量 DASHSCOPE_API_KEY 注入，供 AiConfig 中 QwenEmbeddingModel 使用
dashscope.api-key=${DASHSCOPE_API_KEY}
